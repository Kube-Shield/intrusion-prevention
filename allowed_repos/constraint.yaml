apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: repo-is-dockerhub
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - "crapi"
  parameters:
    repos:
      - "docker.io/"
      - "crapi/"
      - "groundnuty/"
      - "postgres"
      - "mongo"
